<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso administrativo - PCB Science Research Club">
    <title>Acceso Admin - PCB Science Research Club</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('pcb-theme');
                var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { }
        })();
    </script>
</head>
<body>
    <button class="theme-toggle theme-toggle-float" data-theme-toggle type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="Logo.png" alt="PCB Science Research Club" class="login-logo">
                <h1 class="login-title">Panel de Administración</h1>
                <p class="login-subtitle">Accede para gestionar el contenido del club</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" required placeholder="admin@pcbclub.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <div class="password-field">
                        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña">
                            <span id="passwordToggleIcon">👁</span>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
                            <span id="loginBtnText">Iniciar Sesión</span>
                            <span class="spinner-inline" id="loginSpinner" style="display:none;"></span>
                        </button>
                        <a href="#" class="forgot-password" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
            </form>

            <div class="login-footer">
                <p class="login-footer-text">PCB Science Research Club &copy; 2026</p>
                <a href="index.html" class="login-back-link">← Volver al sitio</a>
            </div>
        </div>
    </div>

    <div class="modal" id="forgotPasswordModal">
        <div class="modal-content modal-small">
            <button class="modal-close" id="forgotPasswordClose">&times;</button>
            <div class="modal-header">
                <h2>Recuperar Contraseña</h2>
            </div>
            <form id="forgotPasswordForm" class="modal-form">
                <div class="form-group">
                    <label for="resetEmail">Correo Electrónico</label>
                    <input type="email" id="resetEmail" required placeholder="admin@pcbclub.com" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Enviar Enlace de Recuperación</button>
            </form>
        </div>
    </div>

    <script src="supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script src="login.js"></script>
</body>
</html>
